<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <title>GALAXY PALS</title>

  <link
    rel="stylesheet"
    href="game.css"
  />
</head>

<body>

  <main
    id="gameShell"
    class="game-shell"
  >

    <canvas
      id="gameCanvas"
    ></canvas>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >

      <div class="loading-card">

        <div class="logo-mark">
          ✦
        </div>

        <h1>
          GALAXY PALS
        </h1>

        <p>
          Loading 3D world...
        </p>

      </div>

    </div>


    <!-- HUD -->

    <div class="hud">


      <!-- TOP HUD -->

      <header class="top-hud">

        <div
          id="zoneName"
          class="hud-pill"
        >
          VERDANT WILDS
        </div>

        <div
          id="clockText"
          class="hud-pill"
        >
          DAY 1 • 08:00
        </div>

        <div
          id="levelText"
          class="hud-pill"
        >
          LEVEL 1
        </div>

      </header>


      <!-- CROSSHAIR -->

      <div
        id="crosshair"
        class="crosshair"
        aria-hidden="true"
      ></div>


      <!-- TARGET -->

      <section
        id="targetCard"
        hidden
      >

        <div class="target-top">

          <div>

            <div id="targetName">
              Wild Pal
            </div>

            <div id="targetMeta">
              LV 1 • Neutral
            </div>

          </div>


          <div class="capture-rate">

            <small>
              Capture
            </small>

            <div id="captureChance">
              25%
            </div>

          </div>

        </div>


        <div class="target-bar">

          <div
            id="targetHpBar"
          ></div>

        </div>

      </section>


      <!-- PARTY -->

      <aside
        id="partyHud"
      ></aside>


      <!-- MESSAGE FEED -->

      <aside
        id="feed"
      ></aside>


      <!-- PLAYER STATUS -->

      <section class="player-status">

        <div class="status-card">


          <div class="status-line">

            <div class="status-label">
              HP
            </div>

            <div class="bar-track">

              <div
                id="hpBar"
                class="bar-fill"
              ></div>

            </div>

            <div
              id="hpText"
              class="status-value"
            >
              100
            </div>

          </div>


          <div class="status-line">

            <div class="status-label">
              STAMINA
            </div>

            <div class="bar-track">

              <div
                id="staminaBar"
                class="bar-fill"
              ></div>

            </div>

            <div
              id="staminaText"
              class="status-value"
            >
              100
            </div>

          </div>


          <div class="status-line">

            <div class="status-label">
              FOOD
            </div>

            <div class="bar-track">

              <div
                id="foodBar"
                class="bar-fill"
              ></div>

            </div>

            <div
              id="foodText"
              class="status-value"
            >
              100
            </div>

          </div>

        </div>

      </section>


      <!-- SPHERES -->

      <aside
        id="sphereHud"
      ></aside>


      <!-- CONTROLS -->

      <div
        id="controlsHelp"
        class="controls-help"
      >
        WASD Move • Shift Sprint • Mouse Camera • Left Click Attack • Hold Q Aim • Release Q Throw Sphere • F Summon • E Mount • 1–5 Sphere
      </div>


    </div>


    <!-- MENU BUTTON -->

    <button
      id="menuButton"
      type="button"
    >
      ☰
    </button>


    <!-- MENU -->

    <section
      id="menuPanel"
      hidden
    >

      <div class="menu-card">

        <h2>
          GALAXY PALS
        </h2>

        <p>
          Game Menu
        </p>


        <div class="menu-actions">

          <button
            id="resumeButton"
            type="button"
          >
            Resume
          </button>

          <button
            id="resetButton"
            type="button"
          >
            Reset Save
          </button>

          <button
            id="backButton"
            type="button"
            onclick="window.location.href='/'"
          >
            Back to GALAXY
          </button>

        </div>

      </div>

    </section>


  </main>


  <script
    type="module"
    src="game.js"
  ></script>

</body>

</html>
